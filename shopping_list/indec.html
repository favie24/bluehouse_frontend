<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopping List</title>
 <link rel="stylesheet" href="style.css">
 <script src="script.js">
    
 </script>
</head>
<body>

<div class="app">
  <div class="app-header">
    <h1>Shopping List</h1>
    <span id="count">0 items</span>
  </div>

  <form id="add-form">
    <input id="item-input" type="text" placeholder="Add an item, e.g. 2 lb apples" autocomplete="off" />
    <button type="submit" aria-label="Add item">+</button>
  </form>

  <div class="filters">
    <button type="button" class="filter-btn active" data-filter="all">All</button>
    <button type="button" class="filter-btn" data-filter="active">To buy</button>
    <button type="button" class="filter-btn" data-filter="done">Bought</button>
  </div>

  <ul id="list"></ul>
  <p id="empty-msg">Your list is empty. Add something above.</p>

  <div class="footer">
    <span id="remaining">0 left to buy</span>
    <button type="button" id="clear-done">Clear bought</button>
  </div>
</div>
